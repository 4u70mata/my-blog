<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Blog</title>
    <style>
        :root {
            --bg: #050505;
            --card-bg: #111;
            --text-main: #eee;
            --text-dim: #888;
            --accent: #3498db;
            --border: #222;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* --- Layout Container --- */
        #app {
            width: 100%;
            max-width: 450px; /* Portrait Feel */
            padding: 40px 20px;
        }

        header {
            margin-bottom: 60px;
            text-align: center;
        }

        header h1 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 900;
        }

        header p {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        /* --- List View --- */
        .article-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .article-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .article-card h2 {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .article-card span {
            color: var(--text-dim);
            font-size: 0.8rem;
            display: block;
            margin-bottom: 10px;
        }

        /* --- Article View (The Design You Liked) --- */
        .article-view {
            animation: fadeIn 0.4s ease;
        }

        .btn-back {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .btn-back:hover { color: #fff; border-color: #555; }

        .article-content h1 {
            font-size: 2rem;
            line-height: 1.2;
            margin-bottom: 30px;
        }

        .article-content p {
            font-size: 1.15rem;
            color: #ccc;
            margin-bottom: 25px;
            text-align: justify;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hide sections by default */
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="app">
    <header id="main-header">
        <h1>Archive.Log</h1>
        <p>Thoughts on Systemic Conditioning</p>
    </header>

    <!-- Page 1: List of Articles -->
    <section id="list-view"></section>

    <!-- Page 2: Single Article Reader -->
    <section id="article-view" class="hidden">
        <button class="btn-back" onclick="location.hash=''">← Back</button>
        <div id="article-content" class="article-content"></div>
    </section>
</div>

<script>
    const listView = document.getElementById('list-view');
    const articleView = document.getElementById('article-view');
    const articleContent = document.getElementById('article-content');
    const mainHeader = document.getElementById('main-header');

    let articlesData = [];

    // 1. Fetch the JSON data
    async function loadArticles() {
        try {
            const response = await fetch('articles.json');
            articlesData = await response.json();
            render(); // Handle initial route
        } catch (err) {
            console.error("Error loading articles. Ensure articles.json exists.", err);
        }
    }

    // 2. Routing Logic
    function render() {
        const hash = location.hash.replace('#', '');
        
        if (!hash) {
            showList();
        } else {
            showArticle(hash);
        }
    }

    function showList() {
        mainHeader.classList.remove('hidden');
        articleView.classList.add('hidden');
        listView.classList.remove('hidden');
        
        listView.innerHTML = articlesData.map(post => `
            <div class="article-card" onclick="location.hash='${post.id}'">
                <span>${post.date}</span>
                <h2>${post.title}</h2>
                <p style="color: #888; font-size: 0.95rem;">${post.preview}</p>
            </div>
        `).join('');
    }

    function showArticle(id) {
        const post = articlesData.find(p => p.id === id);
        if (!post) { location.hash = ''; return; }

        mainHeader.classList.add('hidden');
        listView.classList.add('hidden');
        articleView.classList.remove('hidden');

        articleContent.innerHTML = `
            <span>${post.date}</span>
            <h1>${post.title}</h1>
            ${post.content.map(para => `<p>${para}</p>`).join('')}
        `;
        window.scrollTo(0,0);
    }

    // Listen for back/forward button and clicks
    window.addEventListener('hashchange', render);
    
    // Start the app
    loadArticles();
</script>

</body>
</html>
